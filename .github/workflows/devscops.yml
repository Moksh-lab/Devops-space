name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Security & Secret Scan (Gitleaks)
  # ==========================================
  secret-scan:
    name: 🔒 Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: Build, Test & Container Security (Trivy)
  # ==========================================
  build-and-scan:
    name: 🐳 Build, Test & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        run: |
          docker build -t devpulse:latest ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devpulse:latest'
          format: 'table'
          exit-code: '0' # Non-blocking for report display
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Test Container Healthz
        run: |
          # Container ko background me run karein
          docker run -d -p 8000:8000 --name test-app devpulse:latest
          sleep 5
          # Healthz endpoint check karein
          curl -f http://localhost:8000/healthz || exit 1
          echo "✅ DevPulse Health Check Passed Successfully!"